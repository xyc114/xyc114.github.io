<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>武魂觉醒 · 随机生成器（增强版）</title>
    <style>
        :root {
            --bg: #0a0a14;
            --card-bg: rgba(16, 16, 30, 0.88);
            --gold: #d4a843;
            --gold-light: #f0d68a;
            --text: #d0c8b8;
            --text-light: #e8e0d0;
            --text-muted: #a09888;
            --border: rgba(180, 140, 60, 0.35);
            --glow: rgba(200, 150, 50, 0.4);
            --quality-waste: #7a7a7a;
            --quality-normal: #c8c8c8;
            --quality-mid: #5cb85c;
            --quality-high: #4a90d9;
            --quality-top: #9b59b6;
            --quality-super: #e87830;
            --quality-god: #e8b830;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            font-family: 'STSong', 'Songti SC', 'Noto Serif SC', 'SimSun', 'KaiTi', 'STKaiti', '楷体', '华文楷体', 'Georgia', 'Times New Roman', serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            padding-bottom: 40px;
        }
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .main-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 640px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }
        .title-section {
            text-align: center;
            position: relative;
        }
        .subtitle-ornament {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 4px;
        }
        .subtitle-ornament .line {
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }
        .subtitle-ornament .diamond {
            width: 8px;
            height: 8px;
            background: var(--gold-light);
            transform: rotate(45deg);
            box-shadow: 0 0 10px var(--glow);
            animation: diamondPulse 2s ease-in-out infinite;
        }
        @keyframes diamondPulse {
            0%,
            100% {
                box-shadow: 0 0 8px var(--glow);
            }
            50% {
                box-shadow: 0 0 20px var(--glow), 0 0 35px rgba(220, 170, 60, 0.6);
            }
        }
        .main-title {
            font-size: clamp(2rem, 5vw, 2.8rem);
            font-weight: bold;
            letter-spacing: 0.15em;
            background: linear-gradient(180deg, #f8e8b0 0%, #c8943e 30%, #8b5e20 60%, #d4a843 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 6px rgba(180, 120, 30, 0.5));
            margin: 0;
            line-height: 1.3;
        }
        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            letter-spacing: 0.2em;
            margin-top: 2px;
        }
        .badge-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 6px;
        }
        .mini-badge {
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 12px;
            letter-spacing: 0.05em;
            border: 1px solid rgba(180, 140, 60, 0.3);
            color: #c8b878;
            background: rgba(30, 25, 15, 0.5);
            white-space: nowrap;
        }
        .input-section {
            width: 100%;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        .name-input-wrapper {
            flex: 1;
            min-width: 200px;
            position: relative;
        }
        .name-input {
            width: 100%;
            padding: 14px 18px;
            font-size: 1.1rem;
            font-family: inherit;
            letter-spacing: 0.08em;
            background: rgba(20, 20, 40, 0.7);
            border: 1.5px solid var(--border);
            border-radius: 8px;
            color: var(--text-light);
            outline: none;
            transition: all 0.35s ease;
            caret-color: var(--gold);
        }
        .name-input::placeholder {
            color: rgba(150, 140, 120, 0.5);
            letter-spacing: 0.05em;
        }
        .name-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(200, 150, 50, 0.25), 0 0 40px rgba(200, 150, 50, 0.08);
            background: rgba(18, 18, 38, 0.85);
        }
        .awaken-btn {
            padding: 14px 28px;
            font-size: 1.1rem;
            font-family: inherit;
            letter-spacing: 0.12em;
            font-weight: bold;
            background: linear-gradient(135deg, #3a2210 0%, #5a3820 30%, #8b5e20 60%, #6b4020 100%);
            color: #f0d68a;
            border: 1.5px solid rgba(200, 150, 50, 0.5);
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            white-space: nowrap;
            text-shadow: 0 0 8px rgba(220, 170, 60, 0.5);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 220, 150, 0.1);
        }
        .awaken-btn:hover {
            background: linear-gradient(135deg, #4a2a14 0%, #6b4024 30%, #9e6e28 60%, #7b4a24 100%);
            border-color: rgba(230, 180, 60, 0.7);
            box-shadow: 0 6px 25px rgba(200, 150, 40, 0.35), 0 0 50px rgba(200, 150, 40, 0.12);
            color: #ffe8a0;
            transform: translateY(-1px);
        }
        .awaken-btn:active {
            transform: scale(0.96);
            transition: transform 0.1s ease;
        }
        @keyframes awakenFlash {
            0% {
                filter: brightness(1);
            }
            30% {
                filter: brightness(2.5) saturate(1.5);
            }
            100% {
                filter: brightness(1);
            }
        }
        .awaken-btn.flashing {
            animation: awakenFlash 0.5s ease-out;
        }

        .result-card {
            width: 100%;
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            border-radius: 14px;
            padding: 24px 22px;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.55s cubic-bezier(0.22, 0.61, 0.36, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        .result-card.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .result-card::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 20px;
            right: 20px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(220, 180, 80, 0.6), transparent);
            border-radius: 50%;
        }
        .result-card .corner-ornament {
            position: absolute;
            width: 30px;
            height: 30px;
            pointer-events: none;
            opacity: 0.5;
        }
        .result-card .corner-ornament.top-left {
            top: 8px;
            left: 8px;
            border-top: 1px solid rgba(200, 160, 60, 0.4);
            border-left: 1px solid rgba(200, 160, 60, 0.4);
        }
        .result-card .corner-ornament.top-right {
            top: 8px;
            right: 8px;
            border-top: 1px solid rgba(200, 160, 60, 0.4);
            border-right: 1px solid rgba(200, 160, 60, 0.4);
        }
        .result-card .corner-ornament.bottom-left {
            bottom: 8px;
            left: 8px;
            border-bottom: 1px solid rgba(200, 160, 60, 0.4);
            border-left: 1px solid rgba(200, 160, 60, 0.4);
        }
        .result-card .corner-ornament.bottom-right {
            bottom: 8px;
            right: 8px;
            border-bottom: 1px solid rgba(200, 160, 60, 0.4);
            border-right: 1px solid rgba(200, 160, 60, 0.4);
        }
        .soul-name-display {
            text-align: center;
            margin-bottom: 10px;
        }
        .soul-name-display .greeting {
            font-size: 0.95rem;
            color: var(--text-muted);
            letter-spacing: 0.06em;
            margin-bottom: 2px;
        }
        .soul-name-display .soul-name {
            font-size: clamp(1.6rem, 4vw, 2.2rem);
            font-weight: bold;
            letter-spacing: 0.1em;
            color: #f0d68a;
            text-shadow: 0 0 20px rgba(200, 150, 40, 0.5);
            line-height: 1.4;
        }
        .dual-badge {
            display: inline-block;
            background: rgba(200, 60, 40, 0.2);
            color: #f09080;
            font-size: 0.75rem;
            padding: 3px 10px;
            border-radius: 20px;
            letter-spacing: 0.1em;
            border: 1px solid rgba(200, 80, 50, 0.4);
            margin-left: 6px;
            vertical-align: middle;
            animation: dualGlow 2s ease-in-out infinite;
        }
        @keyframes dualGlow {
            0%,
            100% {
                box-shadow: 0 0 8px rgba(220, 80, 50, 0.3);
            }
            50% {
                box-shadow: 0 0 18px rgba(220, 80, 50, 0.6);
            }
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 16px;
            margin: 16px 0;
        }
        @media (max-width: 420px) {
            .info-grid {
                grid-template-columns: 1fr;
                gap: 8px;
            }
        }
        .info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            background: rgba(30, 30, 50, 0.5);
            border-radius: 6px;
            border: 1px solid rgba(100, 80, 50, 0.2);
            font-size: 0.9rem;
        }
        .info-item .info-label {
            color: var(--text-muted);
            font-size: 0.78rem;
            letter-spacing: 0.05em;
            white-space: nowrap;
            min-width: 50px;
        }
        .info-item .info-value {
            color: var(--text-light);
            font-weight: bold;
            letter-spacing: 0.04em;
            font-size: 0.9rem;
        }
        .quality-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 0.06em;
            text-shadow: 0 0 6px currentColor;
        }
        .quality-waste {
            color: #999;
            background: rgba(120, 120, 120, 0.2);
            border: 1px solid rgba(120, 120, 120, 0.3);
            text-shadow: 0 0 6px rgba(150, 150, 150, 0.4);
        }
        .quality-normal {
            color: #d0d0d0;
            background: rgba(200, 200, 200, 0.15);
            border: 1px solid rgba(200, 200, 200, 0.3);
        }
        .quality-mid {
            color: #6cc86c;
            background: rgba(90, 180, 90, 0.15);
            border: 1px solid rgba(100, 200, 100, 0.35);
            text-shadow: 0 0 8px rgba(100, 200, 100, 0.5);
        }
        .quality-high {
            color: #5ca0e8;
            background: rgba(70, 140, 220, 0.15);
            border: 1px solid rgba(80, 150, 230, 0.35);
            text-shadow: 0 0 8px rgba(80, 150, 230, 0.5);
        }
        .quality-top {
            color: #b070d8;
            background: rgba(140, 80, 200, 0.15);
            border: 1px solid rgba(150, 90, 210, 0.35);
            text-shadow: 0 0 10px rgba(150, 90, 210, 0.55);
        }
        .quality-super {
            color: #f09040;
            background: rgba(220, 120, 50, 0.15);
            border: 1px solid rgba(230, 130, 60, 0.35);
            text-shadow: 0 0 12px rgba(230, 130, 50, 0.6);
            animation: superGlow 1.5s ease-in-out infinite;
        }
        @keyframes superGlow {
            0%,
            100% {
                text-shadow: 0 0 10px rgba(230, 130, 50, 0.5);
            }
            50% {
                text-shadow: 0 0 22px rgba(240, 150, 60, 0.8);
            }
        }
        .quality-god {
            color: #f8d840;
            background: rgba(220, 170, 40, 0.2);
            border: 1px solid rgba(240, 190, 50, 0.45);
            text-shadow: 0 0 16px rgba(240, 200, 60, 0.75);
            animation: godGlow 1.2s ease-in-out infinite;
        }
        @keyframes godGlow {
            0%,
            100% {
                text-shadow: 0 0 14px rgba(240, 200, 60, 0.6);
                box-shadow: 0 0 10px rgba(240, 190, 50, 0.3);
            }
            50% {
                text-shadow: 0 0 30px rgba(250, 220, 80, 0.95);
                box-shadow: 0 0 24px rgba(250, 210, 60, 0.5);
            }
        }
        .soul-rings-section {
            margin: 14px 0;
            text-align: center;
        }
        .soul-rings-section .rings-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0.06em;
            margin-bottom: 8px;
        }
        .rings-display {
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .ring-circle {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 3px solid;
            display: inline-block;
            position: relative;
            box-shadow: 0 0 10px currentColor;
            transition: transform 0.3s;
            flex-shrink: 0;
        }
        .ring-circle:hover {
            transform: scale(1.35);
            z-index: 2;
        }
        .ring-white {
            border-color: #c8c8c8;
            box-shadow: 0 0 8px rgba(200, 200, 200, 0.6), inset 0 0 6px rgba(200, 200, 200, 0.3);
        }
        .ring-yellow {
            border-color: #e0b830;
            box-shadow: 0 0 10px rgba(220, 180, 40, 0.7), inset 0 0 6px rgba(220, 180, 40, 0.3);
        }
        .ring-purple {
            border-color: #8b40c0;
            box-shadow: 0 0 10px rgba(140, 70, 190, 0.7), inset 0 0 6px rgba(140, 70, 190, 0.3);
        }
        .ring-black {
            border-color: #1a1a1a;
            box-shadow: 0 0 10px rgba(30, 30, 30, 0.8), inset 0 0 6px rgba(20, 20, 20, 0.5);
            background: rgba(10, 10, 10, 0.6);
        }
        .ring-red {
            border-color: #d03535;
            box-shadow: 0 0 14px rgba(210, 50, 50, 0.8), inset 0 0 8px rgba(210, 50, 50, 0.4);
            animation: redRingGlow 1.5s ease-in-out infinite;
        }
        @keyframes redRingGlow {
            0%,
            100% {
                box-shadow: 0 0 12px rgba(210, 50, 50, 0.7);
            }
            50% {
                box-shadow: 0 0 22px rgba(230, 60, 60, 0.95);
            }
        }
        .ring-gold {
            border-color: #e89830;
            box-shadow: 0 0 18px rgba(235, 155, 40, 0.9), inset 0 0 8px rgba(240, 170, 50, 0.5);
            animation: goldRingGlow 1s ease-in-out infinite;
        }
        @keyframes goldRingGlow {
            0%,
            100% {
                box-shadow: 0 0 16px rgba(235, 155, 40, 0.75);
            }
            50% {
                box-shadow: 0 0 28px rgba(250, 180, 60, 1);
            }
        }
        .ring-legend {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 6px;
            letter-spacing: 0.03em;
        }
        .ring-legend span {
            margin: 0 4px;
            cursor: default;
        }
        .skills-section {
            margin: 14px 0;
            padding: 14px;
            background: rgba(25, 25, 45, 0.5);
            border-radius: 8px;
            border: 1px solid rgba(100, 80, 50, 0.2);
        }
        .skills-section .skills-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 0.08em;
            margin-bottom: 10px;
            text-align: center;
        }
        .skill-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 0;
            font-size: 0.85rem;
            color: var(--text-light);
            border-bottom: 1px dotted rgba(100, 80, 50, 0.15);
            letter-spacing: 0.03em;
        }
        .skill-item:last-child {
            border-bottom: none;
        }
        .skill-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 2px solid;
        }
        .second-soul {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 2px dashed rgba(180, 140, 60, 0.35);
            position: relative;
        }
        .second-soul::before {
            content: '⚡ 第二武魂 ⚡';
            position: absolute;
            top: -11px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--card-bg);
            padding: 2px 14px;
            font-size: 0.75rem;
            color: #e89840;
            letter-spacing: 0.08em;
            white-space: nowrap;
            border-radius: 10px;
            border: 1px solid rgba(220, 150, 50, 0.4);
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .secondary-btn {
            padding: 10px 18px;
            font-size: 0.85rem;
            font-family: inherit;
            letter-spacing: 0.06em;
            background: rgba(30, 30, 50, 0.6);
            border: 1px solid rgba(140, 120, 80, 0.35);
            border-radius: 6px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        .secondary-btn:hover {
            border-color: rgba(200, 160, 80, 0.6);
            color: var(--text-light);
            background: rgba(40, 35, 55, 0.7);
            box-shadow: 0 0 15px rgba(180, 140, 50, 0.2);
        }
        .secondary-btn:active {
            transform: scale(0.95);
        }
        .secondary-btn.danger {
            border-color: rgba(200, 80, 60, 0.35);
        }
        .secondary-btn.danger:hover {
            border-color: rgba(220, 90, 60, 0.7);
            color: #f09080;
            box-shadow: 0 0 15px rgba(200, 80, 50, 0.25);
        }

        /* 历史记录面板 */
        .history-panel {
            width: 100%;
            margin-top: 8px;
        }
        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            padding: 14px 18px;
            background: rgba(20, 20, 40, 0.7);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            transition: all 0.3s ease;
            gap: 12px;
        }
        .history-header:hover {
            border-color: rgba(200, 150, 50, 0.55);
            box-shadow: 0 0 18px rgba(180, 130, 40, 0.2);
        }
        .history-header .history-title {
            font-size: 1rem;
            color: var(--gold-light);
            letter-spacing: 0.08em;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .history-header .history-count {
            font-size: 0.78rem;
            color: var(--text-muted);
            background: rgba(30, 30, 50, 0.6);
            padding: 3px 10px;
            border-radius: 12px;
            letter-spacing: 0.04em;
        }
        .history-header .toggle-icon {
            font-size: 1.2rem;
            color: var(--gold);
            transition: transform 0.4s ease;
            flex-shrink: 0;
        }
        .history-header.open .toggle-icon {
            transform: rotate(180deg);
        }
        .history-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s cubic-bezier(0.22, 0.61, 0.36, 1), opacity 0.4s ease;
            opacity: 0;
            background: rgba(16, 16, 28, 0.7);
            border-radius: 0 0 10px 10px;
            border: 1px solid transparent;
            border-top: none;
            margin-top: -2px;
        }
        .history-body.expanded {
            max-height: 2000px;
            opacity: 1;
            border-color: var(--border);
        }
        .history-list {
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 500px;
            overflow-y: auto;
        }
        .history-list::-webkit-scrollbar {
            width: 5px;
        }
        .history-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .history-list::-webkit-scrollbar-thumb {
            background: rgba(180, 140, 60, 0.3);
            border-radius: 10px;
        }
        .history-empty {
            text-align: center;
            color: var(--text-muted);
            padding: 20px;
            font-size: 0.9rem;
            letter-spacing: 0.06em;
        }
        .history-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: rgba(25, 25, 45, 0.6);
            border-radius: 8px;
            border: 1px solid rgba(100, 80, 50, 0.18);
            cursor: pointer;
            transition: all 0.25s ease;
            flex-wrap: wrap;
            position: relative;
        }
        .history-item:hover {
            border-color: rgba(200, 150, 50, 0.45);
            background: rgba(30, 30, 50, 0.7);
            box-shadow: 0 0 14px rgba(180, 130, 40, 0.15);
        }
        .history-item .h-index {
            font-size: 0.75rem;
            color: var(--text-muted);
            min-width: 22px;
            text-align: center;
            flex-shrink: 0;
        }
        .history-item .h-name {
            font-weight: bold;
            color: var(--text-light);
            letter-spacing: 0.05em;
            min-width: 50px;
            flex-shrink: 0;
        }
        .history-item .h-soul {
            color: #f0d68a;
            letter-spacing: 0.04em;
            flex: 1;
            min-width: 80px;
        }
        .history-item .h-quality {
            flex-shrink: 0;
        }
        .history-item .h-time {
            font-size: 0.7rem;
            color: var(--text-muted);
            flex-shrink: 0;
            letter-spacing: 0.03em;
        }
        .history-item .h-delete {
            position: absolute;
            top: 6px;
            right: 8px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 1px solid rgba(200, 80, 60, 0.35);
            background: rgba(30, 20, 20, 0.6);
            color: #c08070;

                        r: Math.random() * 2.2 + 0.6,
                        vx: (Math.random() - 0.5) * 0.35,
                        vy: (Math.random() - 0.5) * 0.35 - 0.2,
                        alpha: Math.random() * 0.5 + 0.2,
                        alphaSpeed: (Math.random() - 0.5) * 0.008,
                        hue: 35 + Math.random() * 25,
                    });
                }
            }
            initParticles();

            function animateParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.alpha += p.alphaSpeed;
                    if (p.x < 0) { p.x = 0;
                        p.vx *= -1; }
                    if (p.x > canvas.width) { p.x = canvas.width;
                        p.vx *= -1; }
                    if (p.y < 0) { p.y = 0;
                        p.vy *= -1; }
                    if (p.y > canvas.height) { p.y = canvas.height;
                        p.vy *= -1; }
                    if (p.alpha < 0.08) p.alphaSpeed = Math.abs(p.alphaSpeed);

                '浸透', '攻心'

            '投技'];

            const TITLE_CHARS = ['龙', '凤', '虎', '剑', '枪', '冰', '火', '雷', '风', '影', '光', '暗', '星', '海', '天',
                '地', '血', '冥', '圣', '魔', '战', '灵', '魂', '骨', '毒', '幻', '空', '时', '霜', '炎', '铁', '钢',
                '狂', '傲', '幽', '玄', '青', '赤', '金', '银', '月', '日', '云', '雪', '岚', '岩', '刃', '羽',
                '极', '无', '太', '古', '霸', '皇', '帝', '王', '尊', '仙', '神', '佛', '鬼', '妖', '魅', '罡',
            ];

            // ============ 加权随机选择 ============
            function weightedRandom(rand, weights) {
                const total = weights.reduce((a, b) => a + b, 0);
                let r = rand() * total;
                for (let i = 0; i < weights.length; i++) {
                    r -= weights[i];
                    if (r <= 0) return i;
                }
                return weights.length - 1;
            }

            function randomFromArray(rand, arr) {
                return arr[Math.floor(rand() * arr.length)];
            }

            function randomInt(rand, min, max) {
                return Math.floor(rand() * (max - min + 1)) + min;
            }

            // ============ 生成武魂数据 ============
            function generateSoulData(name) {
                const seed = hashString(name.trim() || '无名');
                const rand = createSeededRandom(seed);
                const isDual = rand() < 0.03;

                function generateSingleSoul(randLocal) {
                    const typeKeys = Object.keys(SOUL_TYPES);
                    const typeKey = randomFromArray(randLocal, typeKeys);
                    const typeData = SOUL_TYPES[typeKey];
                    const soulName = randomFromArray(randLocal, typeData.names);
                    const qualityIndex = weightedRandom(randLocal, QUALITY_WEIGHTS);
                    const quality = QUALITIES[qualityIndex];
                    const qualityCss = QUALITY_CSS[qualityIndex];

                    let innateSoulPower;
                    if (qualityIndex >= 6) innateSoulPower = randomInt(randLocal, 9, 10);
                    else if (qualityIndex >= 5) innateSoulPower = randomInt(randLocal, 7, 10);
                    else if (qualityIndex >= 4) innateSoulPower = randomInt(randLocal, 5, 9);
                    else if (qualityIndex >= 3) innateSoulPower = randomInt(randLocal, 3, 7);
                    else if (qualityIndex >= 2) innateSoulPower = randomInt(randLocal, 1, 5);
                    else if (qualityIndex >= 1) innateSoulPower = randomInt(randLocal, 0, 3);
                    else innateSoulPower = randomInt(randLocal, 0, 1);

                    let rankIndex;
                    if (qualityIndex >= 6) rankIndex = randomInt(randLocal, 9, SOUL_RANKS.length - 1);
                    else if (qualityIndex >= 5) rankIndex = randomInt(randLocal, 7, 10);
                    else if (qualityIndex >= 4) rankIndex = randomInt(randLocal, 5, 9);
                    else if (qualityIndex >= 3) rankIndex = randomInt(randLocal, 3, 7);
                    else if (qualityIndex >= 2) rankIndex = randomInt(randLocal, 1, 5);
                    else if (qualityIndex >= 1) rankIndex = randomInt(randLocal, 0, 3);
                    else rankIndex = randomInt(randLocal, 0, 1);

                    const rankData = SOUL_RANKS[rankIndex];
                    const soulLevel = randomInt(randLocal, rankData.minLevel, rankData.maxLevel);
                    const ringCount = rankData.maxRings;
                    const rings = [];
                    for (let i = 0; i < ringCount; i++) {
                        let ringColorIndex;
                        if (rankIndex >= 11) ringColorIndex = weightedRandom(randLocal, [5, 15, 20, 25, 25, 10]);
                        else if (rankIndex >= 9) {
                            if (i === ringCount - 1 && rings.filter(r => r >= 4).length === 0) ringColorIndex =
                                randomInt(randLocal, 4, 5);
                            else ringColorIndex = weightedRandom(randLocal, [8, 18, 25, 28, 18, 3]);
                        } else if (rankIndex >= 7) ringColorIndex = weightedRandom(randLocal, [12, 22, 28, 28, 9, 1]);
                        else if (rankIndex >= 5) ringColorIndex = weightedRandom(randLocal, [18, 28, 30, 20, 4, 0]);
                        else if (rankIndex >= 3) ringColorIndex = weightedRandom(randLocal, [25, 35, 28, 12, 0, 0]);
                        else if (rankIndex >= 1) ringColorIndex = weightedRandom(randLocal, [45, 40, 14, 1, 0, 0]);
                        else ringColorIndex = 0;
                        ringColorIndex = Math.min(ringColorIndex, RING_COLORS.length - 1);
                        rings.push(ringColorIndex);
                    }
                    rings.sort((a, b) => a - b);

                    const skills = [];
                    for (let i = 0; i < rings.length; i++) {
                        let prefixPool, suffixPool;
                        switch (typeKey) {
                            case 'beast':
                                prefixPool = SKILL_PREFIXES_BEAST;
                                suffixPool = SKILL_SUFFIXES_BEAST;
                                break;
                            case 'tool':
                                prefixPool = SKILL_PREFIXES_TOOL;
                                suffixPool = SKILL_SUFFIXES_TOOL;
                                break;
                            case 'plant':
                                prefixPool = SKILL_PREFIXES_PLANT;
                                suffixPool = SKILL_SUFFIXES_PLANT;
                                break;
                            case 'element':
                                prefixPool = SKILL_PREFIXES_ELEMENT;
                                suffixPool = SKILL_SUFFIXES_ELEMENT;
                                break;
                            case 'food':
                                prefixPool = SKILL_PREFIXES_FOOD;
                                suffixPool = SKILL_SUFFIXES_FOOD;
                                break;
                            case 'spiritual':
                                prefixPool = SKILL_PREFIXES_SPIRIT;
                                suffixPool = SKILL_SUFFIXES_SPIRIT;
                                break;
                            case 'poison':
                                prefixPool = SKILL_PREFIXES_POISON;
                                suffixPool = SKILL_SUFFIXES_POISON;
                                break;
                            case 'body':
                                prefixPool = SKILL_PREFIXES_BODY;
                                suffixPool = SKILL_SUFFIXES_BODY;
                                break;
                            default:
                                prefixPool = [...SKILL_PREFIXES_BEAST, ...SKILL_PREFIXES_ELEMENT];
                                suffixPool = [...SKILL_SUFFIXES_BEAST, ...SKILL_SUFFIXES_ELEMENT];
                        }
                        const skillName = randomFromArray(randLocal, prefixPool) + randomFromArray(randLocal,
                            suffixPool);
                        skills.push({ name: skillName, ringIndex: rings[i] });
                    }

                    let title = null;
                    if (rankIndex >= 9 && rankIndex < 11) {
                        const titleChar = randomFromArray(randLocal, TITLE_CHARS);
                        title = titleChar + '斗罗';
                    } else if (rankIndex >= 11) {
                        const titleChar = randomFromArray(randLocal, TITLE_CHARS);
                        title = titleChar + '之神';
                    }

                    return {
                        typeName: typeData.name,
                        typeKey: typeKey,
                        soulName: soulName,
                        quality: quality,
                        qualityIndex: qualityIndex,
                        qualityCss: qualityCss,
                        innateSoulPower: innateSoulPower,
                        rankName: rankData.name,
                        rankIndex: rankIndex,
                        soulLevel: soulLevel,
                        rings: rings,
                        skills: skills,
                        title: title,
                    };
                }

                const primarySoul = generateSingleSoul(rand);
                let secondarySoul = null;
                if (isDual) {
                    const seed2 = hashString(name.trim() + '_dual');
                    const rand2 = createSeededRandom(seed2);
                    secondarySoul = generateSingleSoul(rand2);
                    if (secondarySoul.qualityIndex < 3) {
                        secondarySoul.qualityIndex = randomInt(rand2, 3, 6);
                        secondarySoul.quality = QUALITIES[secondarySoul.qualityIndex];
                        secondarySoul.qualityCss = QUALITY_CSS[secondarySoul.qualityIndex];
                    }
                }

                return {
                    name: name.trim() || '无名',
                    primarySoul,
                    secondarySoul,
                    isDual,
                    timestamp: Date.now(),
                };
            }

            // ============ 渲染结果 ============
            function renderSoulHTML(soulData, label) {
                const ringHTML = soulData.rings.map((rIdx, i) => {
                    const cssClass = RING_CSS_CLASSES[rIdx];
                    const colorName = RING_COLOR_NAMES[rIdx];
                    return `<span class="ring-circle ${cssClass}" title="第${i+1}魂环：${colorName}" style="animation-delay:${i*0.08}s;"></span>`;
                }).join('');

                const skillsHTML = soulData.skills.map((sk, i) => {
                    const dotClass = RING_CSS_CLASSES[sk.ringIndex];
                    return `
                        <div class="skill-item">
                            <span class="skill-dot ${dotClass}"></span>
                            <span>第${i+1}魂技：<strong>${sk.name}</strong></span>
                            <span style="font-size:0.7rem;color:var(--text-muted);margin-left:auto;">${RING_COLOR_NAMES[sk.ringIndex]}</span>
                        </div>`;
                }).join('');

                const titleHTML = soulData.title ?
                    `<div class="info-item"><span class="info-label">封号</span><span class="info-value" style="color:#f0d68a;text-shadow:0 0 10px rgba(220,170,50,0.5);">${soulData.title}</span></div>` :
                    '';

                return `
                    <div class="soul-name-display">
                        <div class="greeting">${label}</div>
                        <div class="soul-name">「${soulData.soulName}」</div>
                    </div>
                    <div class="info-grid">
                        <div class="info-item"><span class="info-label">类型</span><span class="info-value">${soulData.typeName}</span></div>
                        <div class="info-item"><span class="info-label">品质</span><span class="quality-badge ${soulData.qualityCss}">${soulData.quality}</span></div>
                        <div class="info-item"><span class="info-label">先天魂力</span><span class="info-value" style="color:${soulData.innateSoulPower>=9?'#f8d840':soulData.innateSoulPower>=7?'#e89830':'var(--text-light)'};">${soulData.innateSoulPower} 级${soulData.innateSoulPower>=10?' (先天满魂力!)':''}</span></div>
                        <div class="info-item"><span class="info-label">魂力等级</span><span class="info-value">${soulData.soulLevel} 级 · ${soulData.rankName}</span></div>
                        ${titleHTML}
                    </div>
                    <div class="soul-rings-section">
                        <div class="rings-label">🔮 魂环配置 (共 ${soulData.rings.length} 环)</div>
                        <div class="rings-display">${ringHTML || '<span style="color:var(--text-muted);font-size:0.8rem;">暂无魂环</span>'}</div>
                        <div class="ring-legend">${RING_COLOR_NAMES.map((nm,i)=>`<span style="color:${['#c8c8c8','#e0b830','#8b40c0','#555','#d03535','#e89830'][i]};font-size:0.65rem;">●${nm}</span>`).join(' ')}</div>
                    </div>
                    ${soulData.skills.length>0?`<div class="skills-section"><div class="skills-title">⚔️ 魂技列表</div>${skillsHTML}</div>`:''}
                `;
            }

            function renderFullResult(data) {
                let html = renderSoulHTML(data.primarySoul, data.name + ' 的武魂');
                if (data.isDual && data.secondarySoul) {
                    html += '<div class="second-soul">' + renderSoulHTML(data.secondarySoul, '第二武魂') + '</div>';
                }
                return html;
            }

            function showResult(data) {
                currentResultData = data;
                resultContent.innerHTML = renderFullResult(data);
                resultCard.classList.add('visible');
                actionButtons.style.display = 'flex';
                setTimeout(() => { resultCard.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 200);
            }

            function hideResult() {
                resultCard.classList.remove('visible');
                actionButtons.style.display = 'none';
                resultContent.innerHTML = '';
                currentResultData = null;
            }

            // ============ Toast ============
            let toastTimer;

            function showToast(msg) {
                clearTimeout(toastTimer);
                toast.textContent = msg;
                toast.classList.add('show');
                toastTimer = setTimeout(() => { toast.classList.remove('show'); }, 2000);
            }

            // ============ 历史记录管理 ============
            function getHistory() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    return raw ? JSON.parse(raw) : [];
                } catch (e) {
                    return [];
                }
            }

            function saveHistory(records) {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
                } catch (e) {
                    showToast('⚠️ 存储空间不足，请清理旧记录');
                }
            }

            function addToHistory(data) {
                const records = getHistory();
                const record = {
                    id: Date.now(),
                    name: data.name,
                    timestamp: data.timestamp || Date.now(),
                    primarySoul: {
                        soulName: data.primarySoul.soulName,
                        typeName: data.primarySoul.typeName,
                        quality: data.primarySoul.quality,
                        qualityIndex: data.primarySoul.qualityIndex,
                        qualityCss: data.primarySoul.qualityCss,
                        rankName: data.primarySoul.rankName,
                        soulLevel: data.primarySoul.soulLevel,
                        innateSoulPower: data.primarySoul.innateSoulPower,
                        rings: [...data.primarySoul.rings],
                        skills: data.primarySoul.skills.map(s => ({ name: s.name, ringIndex: s.ringIndex })),
                        title: data.primarySoul.title,
                    },
                    isDual: data.isDual,
                    secondarySoul: data.secondarySoul ? {
                        soulName: data.secondarySoul.soulName,
                        typeName: data.secondarySoul.typeName,
                        quality: data.secondarySoul.quality,
                        qualityIndex: data.secondarySoul.qualityIndex,
                        qualityCss: data.secondarySoul.qualityCss,
                        rankName: data.secondarySoul.rankName,
                        soulLevel: data.secondarySoul.soulLevel,
                        innateSoulPower: data.secondarySoul.innateSoulPower,
                        rings: [...data.secondarySoul.rings],
                        skills: data.secondarySoul.skills.map(s => ({ name: s.name, ringIndex: s.ringIndex })),
                        title: data.secondarySoul.title,
                    } : null,
                };
                records.unshift(record);
                if (records.length > MAX_HISTORY) records.length = MAX_HISTORY;
                saveHistory(records);
                refreshHistoryUI();
                showToast('✅ 觉醒记录已保存！');
            }

            function deleteHistoryRecord(id) {
                let records = getHistory();
                records = records.filter(r => r.id !== id);
                saveHistory(records);
                refreshHistoryUI();
                showToast('🗑️ 记录已删除');
            }

            function clearAllHistory() {
                if (confirm('确定要清空所有觉醒记录吗？此操作不可恢复！')) {
                    saveHistory([]);
                    refreshHistoryUI();
                    showToast('🗑️ 所有记录已清空');
                }
            }

            function loadRecordToView(record) {
                const data = {
                    name: record.name,
                    primarySoul: { ...record.primarySoul, skills: record.primarySoul.skills || [], rings: record
                            .primarySoul.rings || [] },
                    secondarySoul: record.secondarySoul ? { ...record.secondarySoul, skills: record.secondarySoul
                            .skills || [], rings: record.secondarySoul.rings || [] } : null,
                    isDual: record.isDual,
                    timestamp: record.timestamp,
                };
                showResult(data);
                resultCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                showToast('📋 已加载历史记录');
            }

            function refreshHistoryUI() {
                const records = getHistory();
                historyCount.textContent = records.length;

                if (records.length === 0) {
                    historyList.innerHTML = '<div class="history-empty">暂无觉醒记录，快去觉醒你的武魂吧 ✨</div>';
                    historyFooter.style.display = 'none';
                } else {
                    historyList.innerHTML = records.map((r, i) => {
                        const timeStr = new Date(r.timestamp).toLocaleString('zh-CN', { month: 'short',
                            day: 'numeric', hour: '2-digit', minute: '2-digit' });
                        const dualMark = r.isDual ? ' <span style="color:#f09080;font-size:0.65rem;">[双生]</span>' :
                            '';
                        return `
                        <div class="history-item" data-id="${r.id}" onclick="window._loadRecordById(${r.id})" title="点击查看详情">
                            <span class="h-index">#${i+1}</span>
                            <span class="h-name">${r.name}</span>
                            <span class="h-soul">${r.primarySoul.soulName}${dualMark}</span>
                            <span class="h-quality"><span class="quality-badge ${r.primarySoul.qualityCss}" style="font-size:0.7rem;">${r.primarySoul.quality}</span></span>
                            <span class="h-time">${timeStr}</span>
                            <span class="h-delete" onclick="event.stopPropagation();window._deleteRecord(${r.id})" title="删除此记录">✕</span>
                        </div>`;
                    }).join('');
                    historyFooter.style.display = 'flex';
                    historyStats.textContent = `共 ${records.length} 条记录 · 最多保存${MAX_HISTORY}条`;
                }
            }

            // 全局函数供onclick调用
            window._loadRecordById = function(id) {
                const records = getHistory();
                const record = records.find(r => r.id === id);
                if (record) loadRecordToView(record);
            };
            window._deleteRecord = function(id) {
                deleteHistoryRecord(id);
            };

            function exportHistory() {
                const records = getHistory();
                if (records.length === 0) {
                    showToast('⚠️ 没有可导出的记录');
                    return;
                }
                let text = '【武魂觉醒记录导出】\n\n';
                records.forEach((r, i) => {
                    const timeStr = new Date(r.timestamp).toLocaleString('zh-CN');
                    text += `--- 记录 #${i+1} ---\n`;
                    text += `姓名：${r.name}\n`;
                    text += `觉醒时间：${timeStr}\n`;
                    text += `武魂：${r.primarySoul.soulName} (${r.primarySoul.typeName})\n`;
                    text += `品质：${r.primarySoul.quality}\n`;
                    text += `魂力等级：${r.primarySoul.soulLevel}级 · ${r.primarySoul.rankName}\n`;
                    text += `先天魂力：${r.primarySoul.innateSoulPower}级\n`;
                    if (r.primarySoul.title) text += `封号：${r.primarySoul.title}\n`;
                    text += `魂环：${r.primarySoul.rings.map(ri=>RING_COLOR_NAMES[ri]).join('、')}\n`;
                    if (r.isDual && r.secondarySoul) {
                        text += `[第二武魂] ${r.secondarySoul.soulName} (${r.secondarySoul.typeName}) - ${r.secondarySoul.quality}\n`;
                    }
                    text += '\n';
                });
                const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = '武魂觉醒记录_' + new Date().toISOString().slice(0, 10) + '.txt';
                a.click();
                URL.revokeObjectURL(url);
                showToast('📤 记录已导出！');
            }

            // ============ 觉醒动作 ============
            function performAwaken() {
                const name = nameInput.value.trim();
                if (!name) {
                    showToast('请先输入你的名字 ✨');
                    nameInput.focus();
                    nameInput.style.borderColor = 'rgba(220,100,60,0.7)';
                    nameInput.style.boxShadow = '0 0 16px rgba(220,100,50,0.3)';
                    setTimeout(() => { nameInput.style.borderColor = 'var(--border)';
                        nameInput.style.boxShadow = 'none'; }, 800);
                    return;
                }
                awakenBtn.classList.add('flashing');
                setTimeout(() => awakenBtn.classList.remove('flashing'), 500);
                hideResult();
                const data = generateSoulData(name);
                setTimeout(() => {
                    showResult(data);
                    spawnBurstParticles();
                    // 自动保存记录
                    addToHistory(data);
                }, 350);
            }

            // ============ 事件监听 ============
            awakenBtn.addEventListener('click', performAwaken);
            nameInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault();
                    performAwaken(); }
            });

            reawakenBtn.addEventListener('click', () => {
                const currentName = nameInput.value.trim();
                if (currentName) {
                    hideResult();
                    setTimeout(() => {
                        const data = generateSoulData(currentName);
                        showResult(data);
                        spawnBurstParticles();
                        addToHistory(data);
                    }, 300);
                } else {
                    showToast('请先输入名字再觉醒 ✨');
                }
            });

            saveRecordBtn.addEventListener('click', () => {
                if (currentResultData) {
                    addToHistory(currentResultData);
                } else {
                    showToast('⚠️ 请先觉醒武魂再保存');
                }
            });

            copyBtn.addEventListener('click', () => {
                if (!currentResultData) { showToast('⚠️ 请先觉醒武魂');
                    return; }
                const data = currentResultData;
                let text = `【${data.name} 的武魂觉醒结果】\n\n`;
                text += `武魂：${data.primarySoul.soulName}\n类型：${data.primarySoul.typeName}\n品质：${data.primarySoul.quality}\n`;
                text +=
                    `先天魂力：${data.primarySoul.innateSoulPower}级\n魂力等级：${data.primarySoul.soulLevel}级 · ${data.primarySoul.rankName}\n`;
                if (data.primarySoul.title) text += `封号：${data.primarySoul.title}\n`;
                text += `魂环：${data.primarySoul.rings.map(r=>RING_COLOR_NAMES[r]).join('、')}\n`;
                if (data.primarySoul.skills.length > 0) text +=
                    `魂技：${data.primarySoul.skills.map((s,i)=>`第${i+1}魂技-${s.name}`).join('、')}\n`;
                if (data.isDual && data.secondarySoul) {
                    text +=
                        `\n【第二武魂】\n武魂：${data.secondarySoul.soulName}\n类型：${data.secondarySoul.typeName}\n品质：${data.secondarySoul.quality}\n`;
                }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => showToast('✅ 武魂信息已复制！')).catch(() =>
                        fallbackCopy(text));
                } else fallbackCopy(text);
            });

            function fallbackCopy(text) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy');
                    showToast('✅ 武魂信息已复制！'); } catch (e) { showToast('⚠️ 复制失败，请手动选择'); }
                document.body.removeChild(ta);
            }

            // 历史面板折叠
            historyHeader.addEventListener('click', () => {
                const isOpen = historyBody.classList.contains('expanded');
                if (isOpen) {
                    historyBody.classList.remove('expanded');
                    historyHeader.classList.remove('open');
                } else {
                    historyBody.classList.add('expanded');
                    historyHeader.classList.add('open');
                    refreshHistoryUI();
                }
            });

            clearHistoryBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                clearAllHistory();
            });
            exportBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                exportHistory();
            });

            // ============ 初始加载 ============
            refreshHistoryUI();
            setTimeout(() => {
                if (!nameInput.value.trim()) {
                    nameInput.value = '唐三';
                    performAwaken();
                }
            }, 600);

            nameInput.addEventListener('focus', function() {
                if (this.value === '唐三' && resultCard.classList.contains('visible')) { /* 保持演示 */ }
            });

            console.log('🌟 武魂觉醒生成器（增强版）已就绪');
            console.log('  ✨ 武魂类型：兽武魂、器武魂、植物武魂、元素武魂、特殊武魂、食物武魂、精神武魂、毒武魂、本体武魂');
            console.log('  📦 武魂总量：400+ 种不同武魂');
            console.log('  💾 觉醒记录自动保存至本地浏览器');
            console.log('  📜 支持查看、删除、导出历史记录');
            console.log('  💎 双生武魂概率约3%，神级武魂等待有缘人！');
        })();
    </script>
</body>
</html>
