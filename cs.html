<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>专注助手 · 可配置网址</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: #0a0f1e;
        }

        .iframe-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #1e2a3a;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #fff;
        }

        /* 右下角半透明微型计时器 */
        .mini-timer {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 6px 14px;
            font-family: monospace;
            font-size: 14px;
            font-weight: 500;
            color: #ffd966;
            letter-spacing: 1px;
            z-index: 20;
            pointer-events: none;
            transition: opacity 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        /* 强制休息遮罩层 */
        .rest-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.94);
            backdrop-filter: blur(12px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0s, opacity 0.3s ease;
            pointer-events: none;
        }

        .rest-overlay.active {
            visibility: visible;
            opacity: 1;
            pointer-events: all;
        }

        .rest-card {
            background: rgba(20, 28, 40, 0.96);
            border-radius: 48px;
            padding: 40px 50px;
            text-align: center;
            box-shadow: 0 25px 45px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,200,100,0.6);
            max-width: 460px;
            width: 85%;
            backdrop-filter: blur(4px);
            animation: fadeSlideUp 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .rest-card h2 {
            font-size: 2rem;
            margin-bottom: 12px;
            color: #ffb347;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .rest-card p {
            font-size: 1.2rem;
            color: #e0e4f0;
            margin-bottom: 28px;
            line-height: 1.4;
        }

        .rest-timer {
            font-size: 3.5rem;
            font-weight: 800;
            font-family: monospace;
            background: #0b0e16;
            padding: 20px 10px;
            border-radius: 60px;
            color: #ffaa33;
            letter-spacing: 6px;
            margin: 20px 0;
            border: 1px solid #ffbb55;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.5), 0 8px 18px rgba(0,0,0,0.3);
        }

        .rest-card small {
            color: #99a7c5;
            font-size: 0.85rem;
            display: block;
            margin-top: 20px;
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 680px) {
            .rest-card {
                padding: 30px 24px;
                width: 90%;
            }
            .rest-card h2 {
                font-size: 1.6rem;
            }
            .rest-timer {
                font-size: 2.5rem;
                letter-spacing: 3px;
            }
            .mini-timer {
                font-size: 11px;
                padding: 4px 10px;
                bottom: 12px;
                right: 12px;
            }
        }
    </style>
</head>
<body>

<div class="iframe-wrapper">
    <iframe id="mainFrame" title="内嵌网页" src="about:blank" sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals allow-top-navigation-by-user-activation allow-downloads allow-presentation"></iframe>
</div>

<!-- 右下角微型计时器 -->
<div class="mini-timer" id="miniTimer">⏳ 30:00</div>

<div class="rest-overlay" id="restOverlay">
    <div class="rest-card">
        <h2>🧘 休息一下</h2>
        <p>你已经玩了很久了，强制休息30分钟，放松眼睛和身体～</p>
        <div class="rest-timer" id="restTimerDisplay">30:00</div>
        <small>⛔ 休息期间无法操作网页，请远眺或活动一下</small>
    </div>
</div>

<script>
    (function(){
        // ======================== 配置：游玩和休息时间均为30分钟 ========================
        const WORK_MINUTES = 30;
        const REST_MINUTES = 30;
        const WORK_SECONDS = WORK_MINUTES * 60;
        const REST_SECONDS = REST_MINUTES * 60;
        
        // 从URL参数中获取目标网站
        function getTargetUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            let target = urlParams.get('url');
            if (target) {
                // 简单补全协议
                if (!target.startsWith('http://') && !target.startsWith('https://')) {
                    target = 'https://' + target;
                }
                return target;
            }
            // 默认网站（可修改为常用网站）
            return 'https://www.example.com';
        }
        
        const TARGET_URL = getTargetUrl();
        
        // DOM 元素
        const iframe = document.getElementById('mainFrame');
        const miniTimer = document.getElementById('miniTimer');
        const restOverlay = document.getElementById('restOverlay');
        const restTimerDisplay = document.getElementById('restTimerDisplay');
        
        // 状态变量
        let isResting = false;
        let remainingWorkSeconds = WORK_SECONDS;
        let remainingRestSeconds = REST_SECONDS;
        
        // 定时器ID
        let workTimeoutId = null;
        let restEndTimeoutId = null;
        let uiUpdateInterval = null;
        
        // 本地存储 key
        const STORAGE_KEY = "focus_assistant_state_30min";
        
        // ======================== 辅助函数 ========================
        function formatTime(seconds) {
            if (isNaN(seconds) || seconds < 0) seconds = 0;
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        function updateMiniTimer() {
            if (!isResting) {
                miniTimer.innerHTML = `⏳ ${formatTime(remainingWorkSeconds)}`;
            } else {
                miniTimer.innerHTML = `💤 ${formatTime(remainingRestSeconds)}`;
            }
        }
        
        function updateRestOverlayTimer() {
            restTimerDisplay.innerText = formatTime(remainingRestSeconds);
        }
        
        // 保存状态到 localStorage
        function saveStateToLocal() {
            try {
                const state = {
                    isResting: isResting,
                    remainingWorkSeconds: Math.max(0, remainingWorkSeconds),
                    remainingRestSeconds: Math.max(0, remainingRestSeconds),
                    timestamp: Date.now(),
                    targetUrl: TARGET_URL  // 记录目标网址，便于恢复时校验
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch(e) { console.warn("存储失败", e); }
        }
        
        // 清除所有定时器
        function clearAllTimers() {
            if (workTimeoutId) { clearTimeout(workTimeoutId); workTimeoutId = null; }
            if (restEndTimeoutId) { clearTimeout(restEndTimeoutId); restEndTimeoutId = null; }
            if (uiUpdateInterval) { clearInterval(uiUpdateInterval); uiUpdateInterval = null; }
        }
        
        function hideOverlay() {
            restOverlay.classList.remove('active');
        }
        
        function showOverlay() {
            restOverlay.classList.add('active');
        }
        
        // ======================== 结束休息 ========================
        function endRest() {
            if (!isResting) return;
            
            if (restEndTimeoutId) { clearTimeout(restEndTimeoutId); restEndTimeoutId = null; }
            
            hideOverlay();
            isResting = false;
            remainingWorkSeconds = WORK_SECONDS;
            remainingRestSeconds = REST_SECONDS;
            
            saveStateToLocal();
            startWorkCycle();
            updateMiniTimer();
        }
        
        // ======================== 开始强制休息 ========================
        function startRest() {
            if (isResting) return;
            
            if (workTimeoutId) { clearTimeout(workTimeoutId); workTimeoutId = null; }
            
            isResting = true;
            if (remainingRestSeconds <= 0) remainingRestSeconds = REST_SECONDS;
            
            showOverlay();
            updateRestOverlayTimer();
            updateMiniTimer();
            
            restEndTimeoutId = setTimeout(() => {
                if (isResting) endRest();
            }, remainingRestSeconds * 1000);
            
            saveStateToLocal();
            
            // 浏览器通知 (如果允许)
            if (Notification.permission === "granted") {
                new Notification("🧘 休息提醒", { body: `已强制休息${REST_MINUTES}分钟，请放松眼睛~`, silent: false });
            } else if (Notification.permission !== "denied") {
                Notification.requestPermission();
            }
        }
        
        // ======================== 通用调度器 (兼顾工作与休息) ========================
        function startUniversalScheduler() {
            clearAllTimers();
            
            uiUpdateInterval = setInterval(() => {
                if (!isResting) {
                    // 工作模式
                    if (remainingWorkSeconds > 0) {
                        remainingWorkSeconds--;
                        updateMiniTimer();
                        saveStateToLocal();
                        if (remainingWorkSeconds <= 0 && !isResting) {
                            startRest();
                        }
                    } else if (!isResting) {
                        startRest();
                    }
                } else {
                    // 休息模式
                    if (remainingRestSeconds > 0) {
                        remainingRestSeconds--;
                        updateRestOverlayTimer();
                        updateMiniTimer();
                        saveStateToLocal();
                        if (remainingRestSeconds <= 0 && isResting) {
                            endRest();
                        }
                    } else if (isResting) {
                        endRest();
                    }
                }
            }, 1000);
            
            // 设置备用定时器
            if (!isResting && remainingWorkSeconds > 0) {
                workTimeoutId = setTimeout(() => {
                    if (!isResting) startRest();
                }, remainingWorkSeconds * 1000);
            }
            if (isResting && remainingRestSeconds > 0) {
                restEndTimeoutId = setTimeout(() => {
                    if (isResting) endRest();
                }, remainingRestSeconds * 1000);
            }
        }
        
        // 启动工作周期
        function startWorkCycle() {
            startUniversalScheduler();
        }
        
        // ======================== 从 localStorage 恢复状态 ========================
        function recoverStateFromLocal() {
            const savedRaw = localStorage.getItem(STORAGE_KEY);
            if (!savedRaw) return false;
            
            try {
                const saved = JSON.parse(savedRaw);
                // 如果保存的目标网址与当前不同，则忽略旧状态（避免跨网站状态混淆）
                if (saved.targetUrl && saved.targetUrl !== TARGET_URL) {
                    console.log("目标网址已变化，忽略旧状态");
                    return false;
                }
                
                const now = Date.now();
                const elapsedSeconds = Math.floor((now - (saved.timestamp || now)) / 1000);
                let recoveredResting = saved.isResting === true;
                let recoveredWorkSec = saved.remainingWorkSeconds;
                let recoveredRestSec = saved.remainingRestSeconds;
                
                if (isNaN(recoveredWorkSec)) recoveredWorkSec = WORK_SECONDS;
                if (isNaN(recoveredRestSec)) recoveredRestSec = REST_SECONDS;
                
                if (recoveredResting) {
                    let newRestSec = recoveredRestSec - elapsedSeconds;
                    if (newRestSec <= 0) {
                        recoveredResting = false;
                        recoveredWorkSec = WORK_SECONDS;
                        recoveredRestSec = REST_SECONDS;
                    } else {
                        recoveredRestSec = newRestSec;
                        recoveredWorkSec = WORK_SECONDS;
                    }
                } else {
                    let newWorkSec = recoveredWorkSec - elapsedSeconds;
                    if (newWorkSec <= 0) {
                        recoveredResting = true;
                        recoveredRestSec = REST_SECONDS;
                        recoveredWorkSec = WORK_SECONDS;
                    } else {
                        recoveredWorkSec = newWorkSec;
                    }
                }
                
                recoveredWorkSec = Math.max(0, Math.min(WORK_SECONDS, recoveredWorkSec));
                recoveredRestSec = Math.max(0, Math.min(REST_SECONDS, recoveredRestSec));
                
                isResting = recoveredResting;
                remainingWorkSeconds = recoveredWorkSec;
                remainingRestSeconds = recoveredRestSec;
                
                if (isResting && remainingRestSeconds > 0) {
                    showOverlay();
                    updateRestOverlayTimer();
                } else {
                    hideOverlay();
                }
                updateMiniTimer();
                return true;
            } catch(e) {
                console.warn("恢复状态失败", e);
                return false;
            }
        }
        
        // ======================== 设置 iframe 内容 ========================
        function setIframeUrl() {
            iframe.src = TARGET_URL;
        }
        
        // 防止意外修改 iframe 的 src（轻度防护，避免用户通过控制台改掉）
        function lockIframeSrc() {
            setInterval(() => {
                if (iframe.src !== TARGET_URL && !iframe.src.includes(new URL(TARGET_URL).hostname)) {
                    iframe.src = TARGET_URL;
                }
            }, 3000);
        }
        
        // ======================== 初始化系统 ========================
        function init() {
            setIframeUrl();
            lockIframeSrc();
            
            const hasRecovered = recoverStateFromLocal();
            if (!hasRecovered) {
                // 全新状态
                isResting = false;
                remainingWorkSeconds = WORK_SECONDS;
                remainingRestSeconds = REST_SECONDS;
                hideOverlay();
                localStorage.removeItem(STORAGE_KEY);
                startUniversalScheduler();
                saveStateToLocal();
                updateMiniTimer();
            } else {
                startUniversalScheduler();
                if (isResting && remainingRestSeconds > 0) showOverlay();
                else hideOverlay();
                updateMiniTimer();
                saveStateToLocal();
            }
            
            // 请求通知权限
            if ("Notification" in window && Notification.permission === "default") {
                Notification.requestPermission();
            }
            
            console.log(`✅ 专注助手已启动，目标网址：${TARGET_URL}，每${WORK_MINUTES}分钟工作，强制休息${REST_MINUTES}分钟，支持刷新恢复计时`);
        }
        
        // 页面关闭前清理定时器
        window.addEventListener('beforeunload', () => {
            clearAllTimers();
        });
        
        init();
    })();
</script>
</body>
</html>
